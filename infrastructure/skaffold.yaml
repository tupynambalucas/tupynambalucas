apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: monorepo-dev
build:
  platforms: ['linux/amd64']
  local: { push: false, useDockerCLI: true, tryImportMissing: false }
  artifacts:
    - image: platform-turbocache
      context: ../platform/services/turbocache
      docker: { dockerfile: Dockerfile }
    - image: platform-headlamp
      context: ../platform/services/headlamp
      docker: { dockerfile: Dockerfile, target: dev }
    - image: platform-otelcol-contrib
      context: ../platform/services/otelcol
      docker: { dockerfile: Dockerfile }
    - image: platform-prometheus
      context: ../platform/services/prometheus
      docker: { dockerfile: Dockerfile }
    - image: platform-loki
      context: ../platform/services/loki
      docker: { dockerfile: Dockerfile }
    - image: platform-tempo
      context: ../platform/services/tempo
      docker: { dockerfile: Dockerfile }
    - image: platform-grafana
      context: ../platform/services/grafana
      docker: { dockerfile: Dockerfile, target: dev }
    - image: cortex-gateway
      context: ../cortex/gateway
      docker: { dockerfile: Dockerfile }
    - image: cortex-mcp-guardrails
      context: ..
      docker: { dockerfile: cortex/mcp/guardrails/Dockerfile }
    - image: cortex-memory-api
      context: ..
      docker: { dockerfile: cortex/memory/services/api/Dockerfile }
    - image: cortex-memory-web
      context: ..
      docker: { dockerfile: cortex/memory/services/web/Dockerfile }
    - image: cortex-mcp-memory
      context: ..
      docker: { dockerfile: cortex/mcp/services/memory/Dockerfile }
    - image: cortex-mcp-inspector
      context: ..
      docker: { dockerfile: cortex/mcp/inspector/Dockerfile }
    - image: cortex-mcp-github
      context: ..
      docker: { dockerfile: cortex/mcp/services/github/Dockerfile }
    - image: cortex-mcp-context7
      context: ..
      docker: { dockerfile: cortex/mcp/services/context7/Dockerfile }
    - image: cortex-mcp-firecrawl
      context: ..
      docker: { dockerfile: cortex/mcp/services/firecrawl/Dockerfile }
    - image: cortex-mcp-grafana
      context: ..
      docker: { dockerfile: cortex/mcp/services/grafana/Dockerfile }
    - image: cortex-mcp-playwright
      context: ..
      docker: { dockerfile: cortex/mcp/services/playwright/Dockerfile }
    - image: studio-penpot-frontend
      context: ../studio/penpot/services/frontend
      docker: { dockerfile: Dockerfile, target: dev }
    - image: studio-penpot-backend
      context: ../studio/penpot/services/backend
      docker: { dockerfile: Dockerfile, target: dev }
    - image: studio-penpot-exporter
      context: ../studio/penpot/services/exporter
      docker: { dockerfile: Dockerfile, target: dev }
    - image: studio-penpot-aide
      context: ../studio/penpot/services/aide
      docker: { dockerfile: Dockerfile, target: dev }
    - image: studio-penpot-valkey
      context: ../studio/penpot/services/valkey
      docker: { dockerfile: Dockerfile, target: dev }
    - image: studio-memos
      context: ../studio/memos/services/memos
      docker: { dockerfile: Dockerfile, target: dev }
manifests:
  kustomize:
    paths: [environments/local]
    buildArgs: [--load-restrictor=LoadRestrictionsNone, --enable-helm]
deploy:
  kubectl:
    hooks:
      before:
        - host:
            command:
              - kubectl
              - apply
              - -f
              - https://raw.githubusercontent.com/traefik/traefik/v3.0/docs/content/reference/dynamic-configuration/kubernetes-crd-definition-v1.yml
portForward:
  - resourceType: service
    resourceName: agentgateway
    namespace: cortex
    port: 8080
    localPort: 8080
  - resourceType: service
    resourceName: memory-api
    namespace: cortex
    port: 3006
    localPort: 3006
  - resourceType: service
    resourceName: penpot-frontend
    namespace: studio
    port: 9005
    localPort: 9005
