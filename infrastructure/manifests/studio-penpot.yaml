# ==========================================
# PENPOT VALKEY (REDIS CACHE)
# ==========================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: penpot-valkey-pvc
  namespace: studio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-valkey
  namespace: studio
  labels:
    app: penpot-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: penpot-valkey
  template:
    metadata:
      labels:
        app: penpot-valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: valkey-data
              mountPath: /data
      volumes:
        - name: valkey-data
          persistentVolumeClaim:
            claimName: penpot-valkey-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: studio
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app: penpot-valkey
---
# ==========================================
# PENPOT BACKEND
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-backend
  namespace: studio
  labels:
    app: penpot-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: penpot-backend
  template:
    metadata:
      labels:
        app: penpot-backend
    spec:
      containers:
        - name: backend
          image: penpotapp/backend:2.16.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6060
          env:
            - name: PENPOT_FLAGS
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: PENPOT_FLAGS
                  optional: true
            - name: PENPOT_REDIS_URI
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: PENPOT_REDIS_URI
                  optional: true
            - name: PENPOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: PENPOT_SECRET_KEY
                  optional: true
            - name: PENPOT_PUBLIC_URI
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: PENPOT_PUBLIC_URI
                  optional: true
            - name: PENPOT_DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: PENPOT_DATABASE_URI
                  optional: true
            - name: PENPOT_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: PENPOT_DATABASE_USERNAME
                  optional: true
            - name: PENPOT_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: PENPOT_DATABASE_PASSWORD
                  optional: true
            - name: PENPOT_OBJECTS_STORAGE_BACKEND
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: PENPOT_OBJECTS_STORAGE_BACKEND
                  optional: true
            - name: PENPOT_OBJECTS_STORAGE_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: PENPOT_OBJECTS_STORAGE_S3_ENDPOINT
                  optional: true
            - name: PENPOT_OBJECTS_STORAGE_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: PENPOT_OBJECTS_STORAGE_S3_BUCKET
                  optional: true
            - name: PENPOT_OBJECTS_STORAGE_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: PENPOT_OBJECTS_STORAGE_S3_REGION
                  optional: true
            - name: PENPOT_OBJECTS_STORAGE_S3_FORCE_PATH_STYLE
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: PENPOT_OBJECTS_STORAGE_S3_FORCE_PATH_STYLE
                  optional: true
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: studio
spec:
  ports:
    - name: http
      port: 6060
      targetPort: 6060
  selector:
    app: penpot-backend
---
# ==========================================
# PENPOT EXPORTER
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-exporter
  namespace: studio
  labels:
    app: penpot-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: penpot-exporter
  template:
    metadata:
      labels:
        app: penpot-exporter
    spec:
      containers:
        - name: exporter
          image: penpotapp/exporter:2.16.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6061
          env:
            - name: PENPOT_FLAGS
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: PENPOT_FLAGS
                  optional: true
            - name: PENPOT_REDIS_URI
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: PENPOT_REDIS_URI
                  optional: true
            - name: PENPOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: PENPOT_SECRET_KEY
                  optional: true
            - name: PENPOT_PUBLIC_URI
              value: http://frontend:8080
---
apiVersion: v1
kind: Service
metadata:
  name: exporter
  namespace: studio
spec:
  ports:
    - name: http
      port: 6061
      targetPort: 6061
  selector:
    app: penpot-exporter
---
# ==========================================
# PENPOT FRONTEND
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-frontend
  namespace: studio
  labels:
    app: penpot-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: penpot-frontend
  template:
    metadata:
      labels:
        app: penpot-frontend
    spec:
      containers:
        - name: frontend
          image: penpotapp/frontend:2.16.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PENPOT_FLAGS
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: PENPOT_FLAGS
                  optional: true
            - name: PENPOT_REDIS_URI
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: PENPOT_REDIS_URI
                  optional: true
            - name: PENPOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: PENPOT_SECRET_KEY
                  optional: true
            - name: PENPOT_BACKEND_URI
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: PENPOT_BACKEND_URI
                  optional: true
            - name: PENPOT_EXPORTER_URI
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: PENPOT_EXPORTER_URI
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: penpot-frontend
  namespace: studio
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: dev-port
      port: 9005
      targetPort: 8080
  selector:
    app: penpot-frontend
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: studio
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: dev-port
      port: 9005
      targetPort: 8080
  selector:
    app: penpot-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: penpot-ingress
  namespace: studio
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
spec:
  ingressClassName: traefik
  rules:
    - host: penpot-dev.tupynambalucas.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: penpot-frontend
                port:
                  number: 9005
---
# ==========================================
# PENPOT AIDE (AI ASSISTANT / MCP)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: penpot-aide
  namespace: studio
  labels:
    app: penpot-aide
spec:
  replicas: 1
  selector:
    matchLabels:
      app: penpot-aide
  template:
    metadata:
      labels:
        app: penpot-aide
    spec:
      containers:
        - name: aide
          image: penpotapp/mcp:2.16.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4400
            - containerPort: 4401
            - containerPort: 4402
            - containerPort: 4403
          env:
            - name: PENPOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: PENPOT_SECRET_KEY
                  optional: true
            - name: PENPOT_MCP_SERVER_HOST
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: PENPOT_MCP_SERVER_HOST
                  optional: true
            - name: PENPOT_MCP_SERVER_LISTEN_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: PENPOT_MCP_SERVER_LISTEN_ADDRESS
                  optional: true
            - name: PENPOT_MCP_PLUGIN_SERVER_HOST
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: PENPOT_MCP_PLUGIN_SERVER_HOST
                  optional: true
            - name: PENPOT_MCP_REMOTE_MODE
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: PENPOT_MCP_REMOTE_MODE
                  optional: true
            - name: PENPOT_MCP_SERVER_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: studio-secrets
                  key: PENPOT_MCP_SERVER_ADDRESS
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: penpot-aide
  namespace: studio
spec:
  ports:
    - name: port-4400
      port: 4400
      targetPort: 4400
    - name: port-4401
      port: 4401
      targetPort: 4401
    - name: port-4402
      port: 4402
      targetPort: 4402
    - name: port-4403
      port: 4403
      targetPort: 4403
  selector:
    app: penpot-aide
