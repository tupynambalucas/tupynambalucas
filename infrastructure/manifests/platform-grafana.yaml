# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.30.0-standalone-strict/all.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: platform
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: platform-grafana
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: GRAFANA_ADMIN_PASSWORD
                  optional: true
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: GRAFANA_ADMIN_USER
                  optional: true
            - name: GF_SECURITY_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: GRAFANA_ADMIN_USER
                  optional: true
            - name: GF_USERS_ALLOW_SIGN_UP
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: GRAFANA_USERS_ALLOW_SIGN_UP
                  optional: true
            - name: GF_DATABASE_TYPE
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: GRAFANA_DATABASE_TYPE
                  optional: true
            - name: GF_DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: GRAFANA_DATABASE_HOST
                  optional: true
            - name: GF_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: GRAFANA_DATABASE_NAME
                  optional: true
            - name: GF_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: GRAFANA_DATABASE_USER
                  optional: true
            - name: GF_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: GRAFANA_DATABASE_PASSWORD
                  optional: true
            - name: GF_DATABASE_SSL_MODE
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: GRAFANA_DATABASE_SSL_MODE
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: platform
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: grafana
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: platform
spec:
  ingressClassName: traefik
  rules:
    - host: grafana-dev.tupynambalucas.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
