apiVersion: apps/v1
kind: Deployment
metadata:
  name: kb-docusaurus-portal
  namespace: docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kb-docusaurus-portal
  template:
    metadata:
      labels:
        app: kb-docusaurus-portal
    spec:
      containers:
        - name: docusaurus
          image: kb-docusaurus-portal
          ports:
            - containerPort: 3002
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2048Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kb-docusaurus-portal
  namespace: docs
spec:
  ports:
    - port: 80
      targetPort: 3002
  selector:
    app: kb-docusaurus-portal
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kb-docusaurus-portal-ingress
  namespace: docs
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: docs-dev.tupynambalucas.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kb-docusaurus-portal
                port:
                  number: 80
