name: Renovate Dependencies

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: 'renovate'
  cancel-in-progress: true

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Renovate Bot
        uses: renovatebot/github-action@v40.0.0
        with:
          configurationFile: shared/git/renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
