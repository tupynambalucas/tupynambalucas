apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: platform-dev
build:
  platforms: ['linux/amd64']
  local:
    push: false
    useDockerCLI: true
    useBuildkit: false
    tryImportMissing: true
    concurrency: 0
  artifacts:
    - image: turbocache
      context: ..
      docker:
        dockerfile: platform/services/turbocache/Dockerfile
manifests:
  rawYaml:
    - infrastructure/kubernetes/namespace.yaml
    - infrastructure/kubernetes/traefik.yaml
    - infrastructure/kubernetes/otel-collector.yaml
    - infrastructure/kubernetes/turbocache.yaml
deploy:
  kubectl: {}
