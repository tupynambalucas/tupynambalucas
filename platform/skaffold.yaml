apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: platform-dev
build:
  platforms: ['linux/amd64']
  local:
    push: false
    useDockerCLI: true
    useBuildkit: false
    tryImportMissing: true
    concurrency: 0
  artifacts:
    - image: turbocache
      context: ..
      docker:
        dockerfile: platform/services/turbocache/Dockerfile
    - image: headlamp
      context: ..
      docker:
        dockerfile: platform/services/headlamp/Dockerfile
manifests:
  kustomize:
    paths:
      - infrastructure/kubernetes
    buildArgs:
      - --load-restrictor=LoadRestrictionsNone
deploy:
  kubectl: {}
