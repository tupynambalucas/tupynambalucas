apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-cloudflare-dns
spec:
  acme:
    email: admin@tupynambalucas.dev
    # Production Let's Encrypt server for 100% trusted HTTPS on any LAN device without installing CAs
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: CLOUDFLARE_API_TOKEN
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-local-tupynambalucas-dev
  namespace: platform
spec:
  secretName: local-tls-secret
  issuerRef:
    name: letsencrypt-cloudflare-dns
    kind: ClusterIssuer
  commonName: '*.lan.tupynambalucas.dev'
  dnsNames:
    - '*.lan.tupynambalucas.dev'
