apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - traefik.yaml
  - otel-collector.yaml
  - turbocache.yaml
  - headlamp.yaml
  - certmanager.yaml
  - grafana.yaml
  - prometheus.yaml

secretGenerator:
  - name: platform-secrets
    namespace: platform
    envs:
      - ../.env
  - name: cloudflare-api-token-secret
    namespace: cert-manager
    envs:
      - ../.env

configMapGenerator:
  - name: prometheus-config
    namespace: platform
    files:
      - prometheus.yml=../../services/prometheus/config.yaml
  - name: otel-collector-config
    namespace: platform
    files:
      - config.yaml=../../services/otpl/config.yaml

generatorOptions:
  disableNameSuffixHash: true
