receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        # Coleta otimizada de CPU, RAM, Disco e Rede dos Pods (cAdvisor)
        - job_name: 'kubernetes-cadvisor'
          scrape_interval: 15s
          scheme: https
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            insecure_skip_verify: true
          bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          kubernetes_sd_configs:
            - role: node
          relabel_configs:
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - target_label: __address__
              replacement: kubernetes.default.svc:443
            - source_labels: [__meta_kubernetes_node_name]
              regex: (.+)
              target_label: __metrics_path__
              replacement: /api/v1/nodes/$${1}/proxy/metrics/cadvisor
          metric_relabel_configs:
            # MANTÉM APENAS métricas essenciais de CPU, RAM, Disco e Rede
            - source_labels: [__name__]
              regex: '(container_cpu_usage_seconds_total|container_cpu_cfs_throttled_seconds_total|container_memory_working_set_bytes|container_memory_usage_bytes|container_fs_usage_bytes|container_fs_limit_bytes|container_fs_reads_bytes_total|container_fs_writes_bytes_total|container_network_receive_bytes_total|container_network_transmit_bytes_total|container_network_receive_errors_total|container_network_transmit_errors_total)'
              action: keep
            # Normalização de labels para Grafana e FreeLens
            - source_labels: [pod_name]
              target_label: pod
              regex: (.+)
              action: replace
            - source_labels: [container_name]
              target_label: container
              regex: (.+)
              action: replace
            - source_labels: [pod, container]
              regex: (.+);$
              target_label: container
              replacement: POD
              action: replace

        # Coleta otimizada de Nó e Volumes/Disco (Kubelet)
        - job_name: 'kubernetes-nodes'
          scrape_interval: 15s
          scheme: https
          tls_config:
            ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            insecure_skip_verify: true
          bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          kubernetes_sd_configs:
            - role: node
          relabel_configs:
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - target_label: __address__
              replacement: kubernetes.default.svc:443
            - source_labels: [__meta_kubernetes_node_name]
              regex: (.+)
              target_label: __metrics_path__
              replacement: /api/v1/nodes/$${1}/proxy/metrics
          metric_relabel_configs:
            # MANTÉM APENAS métricas essenciais do Nó e Volumes/Disco
            - source_labels: [__name__]
              regex: '(node_cpu_seconds_total|node_memory_MemTotal_bytes|node_memory_MemAvailable_bytes|node_memory_WorkingSet_bytes|kubelet_volume_stats_used_bytes|kubelet_volume_stats_capacity_bytes|kubelet_volume_stats_available_bytes)'
              action: keep

  fluentforward:
    endpoint: 0.0.0.0:24224

exporters:
  otlphttp/loki:
    endpoint: 'http://loki:3100/loki/api/v1/push'

  otlphttp/tempo:
    endpoint: 'http://tempo:4318'

  prometheusremotewrite:
    endpoint: 'http://prometheus.platform.svc.cluster.local:9090/api/v1/write'
    tls:
      insecure: true

processors:
  batch:
    send_batch_size: 1024
    timeout: 1s
  resource/fluentd:
    attributes:
      - key: service.name
        value: agentgateway
        action: insert

service:
  pipelines:
    metrics:
      receivers: [otlp, prometheus]
      processors: [batch]
      exporters: [prometheusremotewrite]

    logs:
      receivers: [otlp, fluentforward]
      processors: [resource/fluentd, batch]
      exporters: [otlphttp/loki]

    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/tempo]
