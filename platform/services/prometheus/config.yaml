global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'agentgateway'
    scrape_interval: 15s
    static_configs:
      - targets: ['agentgateway-metrics:15001']
      - targets: ['agentgateway-metrics.cortex.svc.cluster.local:15001']
