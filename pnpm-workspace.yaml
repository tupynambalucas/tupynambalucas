catalogMode: 'strict'
shellEmulator: true

peerDependencyRules:
  ignoreMissing:
    - eslint-plugin-import
  allowAny:
    - eslint

minimumReleaseAgeExclude:
  - turbo
  - '@turbo/darwin-64'
  - '@turbo/darwin-arm64'
  - '@turbo/linux-64'
  - '@turbo/linux-arm64'
  - '@turbo/windows-64'
  - '@turbo/windows-arm64'
  - miniflare@4.20260706.0
  - wrangler@4.108.0

packages:
  - 'hub/services/*'
  - 'hub/packages/*'
  - 'shared/*'
  - 'studio/*'
  - 'tools/*'
  - 'infrastructure'
  - 'platform'
  - 'knowledge-base/collections'
  - 'knowledge-base/docusaurus/packages/*'
  - 'knowledge-base/docusaurus/services/*'
  - 'renderer'
  - 'cortex/mcp/guardrails'
  - 'cortex/mcp/services/*'
  - 'cortex/memory/packages/*'
  - 'cortex/memory/services/*'

catalog:
  '@types/node': ^26.6.2
  'typescript': ^6.0.3
  'tsx': ^4.23.15
  'rimraf': '^6.1.3'
  'turbo': 2.11.5
  'kill-port': '^2.0.1'
  'husky': '^9.1.7'
  'lint-staged': ^17.5.1
  'glob': ^13.0.6
  '@types/glob': ^9.0.0
  '@aws-sdk/client-s3': ^3.1140.0
  '@smithy/node-http-handler': ^4.12.1
  'mime-types': ^3.0.2
  '@types/mime-types': ^3.0.1
  '@clack/prompts': ^1.8.1
  'commander': ^15.0.0
  '@changesets/cli': ^3.0.3
  'wrangler': ^4.140.0
  'jimp': ^1.6.1
  dotenv-cli: ^11.0.0
  gray-matter: ^4.0.3
  vitest: ^5.0.2
  '@types/unist': ^3.0.3
  unified: ^11.0.5
  dotenv: ^18.0.4
  '@crowdin/cli': ^5.3.0
  copyfiles: ^2.4.1
  clsx: ^2.1.1

