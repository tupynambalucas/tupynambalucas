apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: cortex-dev
build:
  platforms: ['linux/amd64']
  local:
    push: false
    useDockerCLI: true
    useBuildkit: false
    tryImportMissing: true
    concurrency: 0
  artifacts:
    - image: tupynambalucas-cortex-gateway
      context: ..
      docker:
        dockerfile: cortex/gateway/Dockerfile
        buildArgs:
          GITHUB_PERSONAL_ACCESS_TOKEN: '{{.GITHUB_PERSONAL_ACCESS_TOKEN}}'
          CONTEXT7_API_KEY: '{{.CONTEXT7_API_KEY}}'
          FIRECRAWL_API_KEY: '{{.FIRECRAWL_API_KEY}}'
      sync:
        manual:
          - src: 'cortex/gateway/config.yaml'
            dest: /config.yaml
    - image: tupynambalucas-cortex-mcp-guardrails
      context: ..
      docker:
        dockerfile: cortex/mcp/guardrails/Dockerfile
    - image: tupynambalucas-cortex-memory-api
      context: ..
      docker:
        dockerfile: cortex/memory/services/api/Dockerfile
    - image: tupynambalucas-cortex-memory-web
      context: ..
      docker:
        dockerfile: cortex/memory/services/web/Dockerfile
    - image: mcp-memory
      context: ..
      docker:
        dockerfile: cortex/mcp/services/memory/Dockerfile
    - image: tupynambalucas-cortex-mcp-inspector
      context: ..
      docker:
        dockerfile: cortex/mcp/inspector/Dockerfile
    - image: mcp-github
      context: ..
      docker:
        dockerfile: cortex/mcp/services/github/Dockerfile
        buildArgs:
          GITHUB_PERSONAL_ACCESS_TOKEN: '{{.GITHUB_PERSONAL_ACCESS_TOKEN}}'
    - image: mcp-firecrawl
      context: ..
      docker:
        dockerfile: cortex/mcp/services/firecrawl/Dockerfile
        buildArgs:
          FIRECRAWL_API_KEY: '{{.FIRECRAWL_API_KEY}}'
    - image: mcp-grafana
      context: ..
      docker:
        dockerfile: cortex/mcp/services/grafana/Dockerfile
        buildArgs:
          GRAFANA_URL: '{{.GRAFANA_CLOUD_URL}}'
          GRAFANA_SERVICE_ACCOUNT_TOKEN: '{{.GRAFANA_SERVICE_ACCOUNT_TOKEN}}'
    - image: mcp-playwright
      context: ..
      docker:
        dockerfile: cortex/mcp/services/playwright/Dockerfile
    - image: agent-copilot
      context: ..
      docker:
        dockerfile: cortex/agents/copilot/Dockerfile
    - image: agent-antigravity
      context: ..
      docker:
        dockerfile: cortex/agents/antigravity/Dockerfile
manifests:
  kustomize:
    paths:
      - infrastructure/kubernetes
    buildArgs:
      - --load-restrictor=LoadRestrictionsNone
deploy:
  kubectl: {}
portForward:
  - resourceType: service
    resourceName: agentgateway
    namespace: cortex
    port: 8080
    localPort: 8080
  - resourceType: service
    resourceName: agentgateway
    namespace: cortex
    port: 15000
    localPort: 15000
  - resourceType: service
    resourceName: memory-api
    namespace: cortex
    port: 3006
    localPort: 3006
  - resourceType: service
    resourceName: memory-web
    namespace: cortex
    port: 9006
    localPort: 9006
  - resourceType: service
    resourceName: mcp-inspector
    namespace: cortex
    port: 6274
    localPort: 6274
