apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: cortex-dev
requires:
  - configs: ['platform-dev']
    path: ../platform/skaffold.yaml
build:
  platforms: ['linux/amd64']
  local:
    push: false
    useDockerCLI: true
    useBuildkit: false
    tryImportMissing: true
    concurrency: 0
  artifacts:
    - image: tupynambalucas-cortex-gateway
      context: gateway
      docker:
        dockerfile: Dockerfile
    - image: tupynambalucas-cortex-mcp-guardrails
      context: ..
      docker:
        dockerfile: cortex/mcp/guardrails/Dockerfile
    - image: tupynambalucas-cortex-memory-api
      context: ..
      docker:
        dockerfile: cortex/memory/services/api/Dockerfile
      sync:
        manual:
          - src: 'cortex/memory/services/api/dist/**/*'
            dest: '/app/dist'
          - src: 'docs/handbook/**/*'
            dest: '/app/docs/handbook'
          - src: 'docs/workspaces/**/*'
            dest: '/app/docs/workspaces'
          - src: 'docs/releases/**/*'
            dest: '/app/docs/releases'
          - src: 'docs/roadmap/**/*'
            dest: '/app/docs/roadmap'
          - src: 'docs/i18n/**/*'
            dest: '/app/docs/i18n'
    - image: tupynambalucas-cortex-memory-web
      context: ..
      docker:
        dockerfile: cortex/memory/services/web/Dockerfile
      sync:
        manual:
          - src: 'cortex/memory/services/web/dist/**/*'
            dest: '/usr/share/nginx/html'
    - image: mcp-memory
      context: ..
      docker:
        dockerfile: cortex/mcp/services/memory/Dockerfile
      sync:
        manual:
          - src: 'cortex/mcp/services/memory/dist/**/*'
            dest: '/app/dist'
    - image: tupynambalucas-cortex-mcp-inspector
      context: ..
      docker:
        dockerfile: cortex/mcp/inspector/Dockerfile
      sync:
        manual:
          - src: 'cortex/mcp/inspector/mcp.json'
            dest: '/app/mcp.json'
    - image: mcp-github
      context: ..
      docker:
        dockerfile: cortex/mcp/services/github/Dockerfile
    - image: mcp-firecrawl
      context: ..
      docker:
        dockerfile: cortex/mcp/services/firecrawl/Dockerfile
      sync:
        manual:
          - src: 'cortex/mcp/services/firecrawl/dist/**/*'
            dest: '/app/dist'
    - image: mcp-grafana
      context: ..
      docker:
        dockerfile: cortex/mcp/services/grafana/Dockerfile
    - image: mcp-playwright
      context: ..
      docker:
        dockerfile: cortex/mcp/services/playwright/Dockerfile
manifests:
  kustomize:
    paths:
      - infrastructure/kubernetes
    buildArgs:
      - --load-restrictor=LoadRestrictionsNone
deploy:
  kubectl: {}
portForward:
  - resourceType: service
    resourceName: agentgateway
    namespace: cortex
    port: 8080
    localPort: 8080
  - resourceType: service
    resourceName: agentgateway
    namespace: cortex
    port: 15000
    localPort: 15000
  - resourceType: service
    resourceName: memory-api
    namespace: cortex
    port: 3006
    localPort: 3006
  - resourceType: service
    resourceName: memory-web
    namespace: cortex
    port: 9006
    localPort: 9006
  - resourceType: service
    resourceName: mcp-inspector
    namespace: cortex
    port: 6274
    localPort: 6274
