# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config:
  adminAddr: '[::]:15000'
  statsAddr: '[::]:15001'
  logging:
    format: json
  tracing:
    otlpEndpoint: http://otel-collector:4317
    randomSampling: true
mcp:
  port: 8080
  policies:
    cors:
      allowOrigins:
        - http://localhost:15000
        - http://127.0.0.1:15000
        - http://localhost:19000
        - http://gateway.local.tupynambalucas.dev:15000
        - http://gateway-admin.local.tupynambalucas.dev:15000
        - https://gateway.local.tupynambalucas.dev:15000
        - https://gateway-admin.local.tupynambalucas.dev:15000
        - http://localhost:6274
        - http://localhost:9006
        - http://localhost:5173
        - http://localhost:3000
        - http://localhost:3002
        - http://localhost:8080
        - http://gateway.local.tupynambalucas.dev
        - http://gateway-admin.local.tupynambalucas.dev
        - https://gateway.local.tupynambalucas.dev
        - https://gateway-admin.local.tupynambalucas.dev
        - http://gateway.lan.tupynambalucas.dev
        - http://gateway-admin.lan.tupynambalucas.dev
        - https://gateway.lan.tupynambalucas.dev
        - https://gateway-admin.lan.tupynambalucas.dev
        - http://memory.local.tupynambalucas.dev
        - https://memory.local.tupynambalucas.dev
        - http://turbocache.local.tupynambalucas.dev
        - https://turbocache.local.tupynambalucas.dev
        - http://headlamp.local.tupynambalucas.dev
        - https://headlamp.local.tupynambalucas.dev
        - http://headlamp.lan.tupynambalucas.dev
        - https://headlamp.lan.tupynambalucas.dev
        - http://grafana.local.tupynambalucas.dev
        - https://grafana.local.tupynambalucas.dev
        - http://grafana.lan.tupynambalucas.dev
        - https://grafana.lan.tupynambalucas.dev
        - http://traefik.local.tupynambalucas.dev
        - https://traefik.local.tupynambalucas.dev
        - http://traefik.lan.tupynambalucas.dev
        - https://traefik.lan.tupynambalucas.dev
      allowMethods:
        - '*'
        - GET
        - POST
        - OPTIONS
        - PUT
        - DELETE
      allowHeaders:
        - '*'
      exposeHeaders:
        - Mcp-Session-Id
      allowCredentials: true
    mcpGuardrails:
      processors:
        - kind: remote
          host: mcp-guardrails:9001
          failureMode: failOpen
          methods:
            tools/call: request
            tools/list: response
  targets:
    - name: github
      mcp:
        host: http://mcp-github:8080/mcp
      policies:
        backendAuth:
          key: '$GITHUB_PERSONAL_ACCESS_TOKEN'
    - name: context7
      mcp:
        host: https://mcp.context7.com/mcp
      policies:
        backendAuth:
          key: '$CONTEXT7_API_KEY'
    - name: firecrawl
      mcp:
        host: http://mcp-firecrawl:8080/mcp
    - name: grafana
      mcp:
        host: http://mcp-grafana:8080/mcp
    - name: playwright
      mcp:
        host: http://mcp-playwright:8080/mcp
    - name: memory
      mcp:
        host: http://mcp-memory:8080/mcp
  statefulMode: stateless
  prefixMode: null
  failureMode: failOpen
binds: []
llm:
  port: 4000
  models: []
  providers: []
  virtualModels: []
frontendPolicies:
  http:
    maxBufferSize: 33554432
