# yaml-language-server: $schema=https://agentgateway.dev/schema/config
config:
  adminAddr: '[::]:15000'
  statsAddr: '[::]:15001'
  logging:
    format: json
  tracing:
    otlpEndpoint: http://otel-collector:4317
    randomSampling: true

gateways:
  default:
    port: 8080

mcp:
  gateways: [default]
  statefulMode: stateful
  prefixMode: conditional
  failureMode: failOpen
  policies:
    cors:
      allowOrigins:
        - '*'
        - 'https://agentgateway.tupynambalucas.dev'
        - 'https://agentgateway-dev.tupynambalucas.dev'
        - 'https://agentgateway-mcp-dev.tupynambalucas.dev'
        - 'https://agentgateway-mcp.tupynambalucas.dev'
        - 'https://agentgateway-ingress-dev.tupynambalucas.dev'
        - 'https://agentgateway-ingress.tupynambalucas.dev'
      allowMethods:
        - '*'
        - GET
        - POST
        - OPTIONS
        - PUT
        - DELETE
      allowHeaders:
        - '*'
      exposeHeaders:
        - Mcp-Session-Id
      allowCredentials: true
    authorization:
      rules:
        - 'request.path == "/ui" || request.path.startsWith("/ui/") || request.headers["x-mcp-token"] == "$CORTEX_MCP_TOKEN" || request.headers["authorization"] == "Bearer $CORTEX_MCP_TOKEN"'
    requestHeaderModifier:
      set:
        accept: 'application/json, text/event-stream'
  targets:
    - name: github
      mcp:
        host: http://mcp-github:8080/mcp
      policies:
        backendAuth:
          key: '$GITHUB_PERSONAL_ACCESS_TOKEN'
    - name: context7
      mcp:
        host: https://mcp.context7.com/mcp
      policies:
        backendAuth:
          key: '$CONTEXT7_API_KEY'
    - name: firecrawl
      mcp:
        host: http://mcp-firecrawl:8080/mcp
    - name: grafana
      mcp:
        host: http://mcp-grafana:8080/mcp
    - name: playwright
      mcp:
        host: http://mcp-playwright:8080/mcp
    - name: memory
      mcp:
        host: http://mcp-memory:8080/mcp

ui:
  gateways: [default]

llm:
  gateways: [default]
  models: []
  providers: []
  virtualModels: []

frontendPolicies:
  http:
    maxBufferSize: 33554432
