apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: cortex
  labels:
    app: agentgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentgateway
  template:
    metadata:
      labels:
        app: agentgateway
    spec:
      containers:
        - name: agentgateway
          image: cr.agentgateway.dev/agentgateway:latest
          imagePullPolicy: IfNotPresent
          args:
            - '-f'
            - '/config/config.yaml'
          ports:
            - name: traffic
              containerPort: 8080
            - name: llm
              containerPort: 4000
            - name: admin
              containerPort: 15000
            - name: stats
              containerPort: 15001
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: cortex-secrets
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
                  optional: true
            - name: CONTEXT7_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cortex-secrets
                  key: CONTEXT7_API_KEY
                  optional: true
            - name: GITHUB_PERSONAL_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cortex-secrets
                  key: GITHUB_PERSONAL_ACCESS_TOKEN
                  optional: true
            - name: FIRECRAWL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cortex-secrets
                  key: FIRECRAWL_API_KEY
                  optional: true
            - name: CORTEX_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cortex-secrets
                  key: CORTEX_MCP_TOKEN
                  optional: true
          volumeMounts:
            - name: config-volume
              mountPath: /config
      volumes:
        - name: config-volume
          configMap:
            name: agentgateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  namespace: cortex
spec:
  ports:
    - name: traffic
      port: 8080
      targetPort: 8080
    - name: llm
      port: 4000
      targetPort: 4000
    - name: admin
      port: 15000
      targetPort: 15000
    - name: stats
      port: 15001
      targetPort: 15001
  selector:
    app: agentgateway
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway-metrics
  namespace: cortex
spec:
  ports:
    - name: stats
      port: 15001
      targetPort: 15001
  selector:
    app: agentgateway
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentgateway-ingress
  namespace: cortex
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure, mcp
    traefik.ingress.kubernetes.io/custom-request-headers: 'X-Forwarded-Proto: https'
    traefik.ingress.kubernetes.io/custom-response-headers: 'Access-Control-Allow-Origin: *||Access-Control-Expose-Headers: Mcp-Session-Id||Access-Control-Allow-Methods: GET, POST, OPTIONS, PUT, DELETE||Access-Control-Allow-Headers: *||Access-Control-Allow-Credentials: true'
spec:
  ingressClassName: traefik
  rules:
    - host: agentgateway-dev.tupynambalucas.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentgateway
                port:
                  number: 8080
    - host: agentgateway.tupynambalucas.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentgateway
                port:
                  number: 8080
    - host: agentgateway-ingress-dev.tupynambalucas.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentgateway
                port:
                  number: 8080
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: agentgateway
                port:
                  number: 4000
    - host: agentgateway-ingress.tupynambalucas.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentgateway
                port:
                  number: 8080
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: agentgateway
                port:
                  number: 4000
    - host: agentgateway-mcp-dev.tupynambalucas.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentgateway
                port:
                  number: 8080
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: agentgateway
                port:
                  number: 4000
    - host: agentgateway-mcp.tupynambalucas.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentgateway
                port:
                  number: 8080
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: agentgateway
                port:
                  number: 4000
    - host: localhost
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: agentgateway
                port:
                  number: 8080
          - path: /sse
            pathType: Prefix
            backend:
              service:
                name: agentgateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentgateway
                port:
                  number: 15000
