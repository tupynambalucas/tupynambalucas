apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: cortex
  labels:
    app: agentgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentgateway
  template:
    metadata:
      labels:
        app: agentgateway
    spec:
      containers:
        - name: agentgateway
          image: tupynambalucas-cortex-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: traffic
              containerPort: 8080
            - name: admin
              containerPort: 15000
            - name: stats
              containerPort: 15001
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: cortex-secrets
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
                  optional: true
            - name: CONTEXT7_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cortex-secrets
                  key: CONTEXT7_API_KEY
                  optional: true
            - name: GITHUB_PERSONAL_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cortex-secrets
                  key: GITHUB_PERSONAL_ACCESS_TOKEN
                  optional: true
            - name: FIRECRAWL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cortex-secrets
                  key: FIRECRAWL_API_KEY
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  namespace: cortex
spec:
  ports:
    - name: traffic
      port: 8080
      targetPort: 8080
    - name: admin
      port: 15000
      targetPort: 15000
    - name: stats
      port: 15001
      targetPort: 15001
  selector:
    app: agentgateway
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway-metrics
  namespace: cortex
spec:
  ports:
    - name: stats
      port: 15001
      targetPort: 15001
  selector:
    app: agentgateway
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentgateway-ingress
  namespace: cortex
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure, mcp
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - gateway.local.tupynambalucas.dev
        - gateway-admin.local.tupynambalucas.dev
      secretName: local-tls-secret
  rules:
    - host: gateway.local.tupynambalucas.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentgateway
                port:
                  number: 8080
    - host: gateway-admin.local.tupynambalucas.dev
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: agentgateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentgateway
                port:
                  number: 15000
    - host: localhost
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: agentgateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentgateway
                port:
                  number: 15000
    - http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: agentgateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentgateway
                port:
                  number: 15000
