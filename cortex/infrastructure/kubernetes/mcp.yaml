# MCP Guardrails Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-guardrails
  namespace: cortex
  labels:
    app: mcp-guardrails
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-guardrails
  template:
    metadata:
      labels:
        app: mcp-guardrails
    spec:
      containers:
        - name: mcp-guardrails
          image: tupynambalucas-cortex-mcp-guardrails:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9001
          env:
            - name: GUARDRAILS_PORT
              valueFrom:
                secretKeyRef:
                  name: cortex-secrets
                  key: GUARDRAILS_PORT
                  optional: true
            - name: GUARDRAILS_HOST
              valueFrom:
                secretKeyRef:
                  name: cortex-secrets
                  key: GUARDRAILS_HOST
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-guardrails
  namespace: cortex
spec:
  ports:
    - port: 9001
      targetPort: 9001
  selector:
    app: mcp-guardrails
---
# MCP Memory Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-memory
  namespace: cortex
  labels:
    app: mcp-memory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-memory
  template:
    metadata:
      labels:
        app: mcp-memory
    spec:
      containers:
        - name: mcp-memory
          image: tupynambalucas-cortex-mcp-memory:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: cortex-secrets
                  key: MCP_MEMORY_PORT
                  optional: true
            - name: MEMORY_API_URL
              value: 'http://memory-api:3006'
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-memory
  namespace: cortex
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: mcp-memory
---
