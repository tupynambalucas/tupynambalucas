# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: studio

resources:
  - namespace.yaml
  - certmanager.yaml
  - penpot.yaml
  - memos.yaml

secretGenerator:
  - name: studio-secrets
    envs:
      - ../.env

generatorOptions:
  disableNameSuffixHash: true
