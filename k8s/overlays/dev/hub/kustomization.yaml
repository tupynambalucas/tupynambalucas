apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../manifests/namespaces
  - ../../../manifests/hub/observability
  - ../../../manifests/hub/network
  - ../../../manifests/hub/tools
  - ../../../manifests/hub/studio/memos
  - ../../../manifests/hub/studio/penpot
  - ../../../manifests/hub/cortex/gateway
  - ../../../manifests/hub/cortex/mcp/services
  - ../../../manifests/hub/cortex/memory
patches:
  - path: patches/memory-ingress-patch.json
    target:
      kind: Ingress
      name: memory-ingress
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: platform-secrets
    namespace: platform
    envs:
      - ../../../.env
  - name: cortex-secrets
    namespace: cortex
    envs:
      - ../../../.env
