deployment:
  replicas: 1
image:
  name: traefik
  tag: v3.1
logs:
  general:
    level: DEBUG
ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik
providers:
  kubernetesIngress:
    enabled: true
ports:
  web:
    port: 80
    expose: true
    exposedPort: 80
    forwardedHeaders:
      insecure: true
  websecure:
    port: 443
    expose: true
    exposedPort: 443
    forwardedHeaders:
      insecure: true
  traefik:
    port: 8082
    expose: false
ingressRoute:
  dashboard:
    enabled: false

extraObjects:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: traefik-extra
    rules:
      - apiGroups:
          - discovery.k8s.io
        resources:
          - endpointslices
        verbs:
          - get
          - list
          - watch
      - apiGroups:
          - ''
        resources:
          - nodes
        verbs:
          - get
          - list
          - watch
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: traefik-extra
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: traefik-extra
    subjects:
      - kind: ServiceAccount
        name: traefik
        namespace: docs
