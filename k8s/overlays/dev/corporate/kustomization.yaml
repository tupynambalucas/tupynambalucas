apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../manifests/corporate
  - ../../../manifests/corporate/portal
  - ../../../manifests/corporate/mongodb
patches:
  - target:
      kind: Ingress
      name: kb-docusaurus-portal-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: docs-dev.tupynambalucas.dev
  - target:
      kind: Ingress
      name: web-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: web-dev.tupynambalucas.dev
  - target:
      kind: Ingress
      name: api-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api-dev.tupynambalucas.dev
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 5173
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: VITE_TURNSTILE_SITE_KEY
          valueFrom:
            secretKeyRef:
              name: corporate-secrets
              key: VITE_TURNSTILE_SITE_KEY
              optional: true
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: VITE_CLOUDINARY_CLOUD_NAME
          valueFrom:
            secretKeyRef:
              name: corporate-secrets
              key: VITE_CLOUDINARY_CLOUD_NAME
              optional: true
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: development
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MONGO_USER
          valueFrom:
            secretKeyRef:
              name: corporate-secrets
              key: MONGO_USER
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: corporate-secrets
              key: MONGO_PASSWORD
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MONGO_DB_NAME
          valueFrom:
            secretKeyRef:
              name: corporate-secrets
              key: MONGO_DB_NAME
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MONGO_URI
          value: mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@mongodb:27017/$(MONGO_DB_NAME)?authSource=admin
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: corporate-secrets
    namespace: corporate
    envs:
      - ../../../.env
