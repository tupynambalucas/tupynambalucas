apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../manifests/hub/namespaces
  - ../../../manifests/hub/observability
  - ../../../manifests/hub/network
  - ../../../manifests/hub/tools
  - ../../../manifests/hub/studio
  - ../../../manifests/hub/cortex
patches:
  - target:
      kind: Deployment
      name: cloudflared
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: platform-secrets
    namespace: platform
    envs:
      - ../../../.env
  - name: cortex-secrets
    namespace: cortex
    envs:
      - ../../../.env
  - name: studio-secrets
    namespace: studio
    envs:
      - ../../../.env
