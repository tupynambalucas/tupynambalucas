apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../manifests/corporate
patches:
  - target:
      kind: Ingress
      name: kb-docusaurus-portal-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: docs-stg.tupynambalucas.dev
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: docs-secrets
    namespace: docs
    envs:
      - ../../../.env
