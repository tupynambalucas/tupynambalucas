# MCP Firecrawl Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-firecrawl
  namespace: cortex
  labels:
    app: mcp-firecrawl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-firecrawl
  template:
    metadata:
      labels:
        app: mcp-firecrawl
    spec:
      containers:
        - name: mcp-firecrawl
          image: cortex-mcp-firecrawl:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: '64Mi'
              cpu: '25m'
            limits:
              memory: '256Mi'
              cpu: '200m'
          env:
            - name: FIRECRAWL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cortex-secrets
                  key: FIRECRAWL_API_KEY
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-firecrawl
  namespace: cortex
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: mcp-firecrawl
