# MCP Grafana Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-grafana
  namespace: cortex
  labels:
    app: mcp-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-grafana
  template:
    metadata:
      labels:
        app: mcp-grafana
    spec:
      containers:
        - name: mcp-grafana
          image: cortex-mcp-grafana:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: '64Mi'
              cpu: '25m'
            limits:
              memory: '256Mi'
              cpu: '200m'
          env:
            - name: GRAFANA_URL
              valueFrom:
                secretKeyRef:
                  name: cortex-secrets
                  key: GRAFANA_URL
                  optional: true
            - name: GRAFANA_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: GRAFANA_ADMIN_USER
                  optional: true
            - name: GRAFANA_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: GRAFANA_ADMIN_PASSWORD
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-grafana
  namespace: cortex
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: mcp-grafana
