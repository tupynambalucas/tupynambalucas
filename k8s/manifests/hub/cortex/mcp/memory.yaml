# MCP Memory Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-memory
  namespace: cortex
  labels:
    app: mcp-memory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-memory
  template:
    metadata:
      labels:
        app: mcp-memory
    spec:
      containers:
        - name: mcp-memory
          image: cortex-mcp-memory:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: '64Mi'
              cpu: '25m'
            limits:
              memory: '256Mi'
              cpu: '200m'
          env:
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: cortex-secrets
                  key: MEMORY_MCP_PORT
                  optional: true
            - name: MEMORY_API_URL
              valueFrom:
                secretKeyRef:
                  name: cortex-secrets
                  key: MEMORY_API_URL
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-memory
  namespace: cortex
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: mcp-memory
