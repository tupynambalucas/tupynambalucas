apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: memory-ingress
  namespace: cortex
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/custom-request-headers: 'X-Forwarded-Proto: https'
spec:
  ingressClassName: traefik
  rules:
    - host: memory-dev.tupynambalucas.dev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: memory-api
                port:
                  number: 3006
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: memory-api
                port:
                  number: 3006
          - path: /
            pathType: Prefix
            backend:
              service:
                name: memory-web
                port:
                  number: 9006
    - host: memory.tupynambalucas.dev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: memory-api
                port:
                  number: 3006
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: memory-api
                port:
                  number: 3006
          - path: /
            pathType: Prefix
            backend:
              service:
                name: memory-web
                port:
                  number: 9006
    - host: memory-api-dev.tupynambalucas.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: memory-api
                port:
                  number: 3006
    - host: memory-api.tupynambalucas.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: memory-api
                port:
                  number: 3006
