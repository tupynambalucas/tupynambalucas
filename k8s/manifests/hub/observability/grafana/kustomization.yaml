apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - grafana.yaml
configMapGenerator:
  - name: grafana-dashboards
    namespace: platform
    files:
      - dashboards.yaml=grafana-provisioning/dashboards/dashboards.yaml
  - name: grafana-dashboards-sources
    namespace: platform
    files:
      - agentgateway-dashboard.json=grafana-provisioning/dashboards/sources/agentgateway-dashboard.json
  - name: grafana-datasources
    namespace: platform
    files:
      - datasources.yaml=grafana-provisioning/datasources/datasources.yaml
